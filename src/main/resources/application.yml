server:
  port: 8081

spring:
  application:
    name: linkforge-server

  datasource:
    url: jdbc:mysql://localhost:3306/linkforge?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 111111
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  redisson:
    address: redis://127.0.0.1:6379


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.linkforge.entity
  configuration:
    map-underscore-to-camel-case: true